spring.application.name=ms-usuarios
# Puerto por donde correrá este microservicio
server.port=8081

# Conexión a la base de datos de XAMPP
spring.datasource.url=jdbc:mysql://localhost:3306/foro_usuarios_db
spring.datasource.username=root
spring.datasource.password=

# Configuración de Hibernate para crear tablas automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect